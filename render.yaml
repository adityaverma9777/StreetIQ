services:
  - type: web
    name: streetiq-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3001
      - key: ALLOWED_ORIGINS
        value: "https://streetiq-rose.vercel.app,http://localhost:5173"
      - key: GEMINI_API_KEY
        sync: false
